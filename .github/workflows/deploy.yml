name: Deploy til Firebase

# Manuel udløsning fra GitHub → fanen "Actions" → "Deploy til Firebase" → "Run workflow".
# Kræver repo-secret FIREBASE_SERVICE_ACCOUNT (indholdet af en service-account-JSON,
# se docs/firebase-setup.md). Intet deployes automatisk ved push — kun når du trykker.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Hvad skal deployes?'
        type: choice
        default: hosting-rules
        options:
          - hosting-rules        # frontend + security rules + indexes (virker på gratis Spark-plan)
          - functions            # kun Cloud Functions (kræver Blaze-plan)
          - all                  # alt (kræver Blaze-plan)
      seed:
        description: 'Indlæs kampe/bonus i databasen bagefter? (seed)'
        type: boolean
        default: false

# Kør GitHub's JavaScript-actions på Node 24 (Node 20 udfases)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: tour-85928
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer afhængigheder
        run: |
          npm ci
          cd functions && npm ci

      - name: Skriv service-account fra secret
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"

      - name: Installer Firebase CLI
        run: npm install -g firebase-tools

      - name: Skriv .env til build (offentlig web-config fra repo-variabler)
        if: ${{ inputs.target != 'functions' }}
        run: |
          if [ -z "${{ vars.VITE_FIREBASE_PROJECT_ID }}" ]; then
            echo "::error::Mangler repo-variabler VITE_FIREBASE_* — tilføj dem under Settings → Secrets and variables → Actions → Variables før deploy (se docs/firebase-setup.md)."
            exit 1
          fi
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_USE_EMULATORS=false
          VITE_OWNER_EMAIL=${{ vars.VITE_OWNER_EMAIL }}
          VITE_RECAPTCHA_SITE_KEY=${{ vars.VITE_RECAPTCHA_SITE_KEY }}
          EOF

      - name: Byg frontend
        if: ${{ inputs.target != 'functions' }}
        run: npm run build

      - name: Deploy hosting + regler
        if: ${{ inputs.target != 'functions' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          # VIGTIGT: hosting deployes ALENE (uden functions). Tidligere blev
          # hosting+rules+functions deployet i ÉN kommando — og når functions
          # fejlede (typisk et harmløst 409 fra 2nd-gen), sprang Firebase
          # hosting-RELEASE'et over: filerne blev uploadet, men den nye version
          # kom aldrig live. Functions deployes nu i et separat, ikke-fatalt
          # trin nedenfor, så et functions-hikke ALDRIG kan blokere at den nye
          # hjemmeside går live. firestore:indexes deployes ligeledes separat.
          ONLY="hosting,firestore:rules"
          # Firebase-deploy fejler en gang imellem med en forbigående
          # "Failed to authenticate" — prøv igen med backoff i stedet for at
          # kræve manuel genkørsel.
          n=0; max=3
          until [ "$n" -ge "$max" ]; do
            n=$((n + 1))
            echo "::group::Deploy-forsøg $n/$max"
            set +e
            out=$(firebase deploy --only "$ONLY" --project "$PROJECT_ID" --non-interactive --force 2>&1)
            code=$?
            set -e
            echo "$out"
            if [ "$code" -eq 0 ]; then
              echo "::endgroup::"
              echo "Deploy lykkedes på forsøg $n/$max."
              exit 0
            fi
            # Idempotent hosting-no-op: det byggede indhold er allerede den
            # aktive version på live-kanalen (HTTP 400). Det er en succes, ikke
            # en fejl — ellers fejler et "uændret" deploy uberettiget.
            if printf '%s' "$out" | grep -q "is the current active version"; then
              echo "::endgroup::"
              echo "Hosting-indhold var allerede den aktive version — intet at gøre (forsøg $n/$max)."
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Deploy fejlede på forsøg $n/$max."
            [ "$n" -lt "$max" ] && sleep $((n * 15))
          done
          echo "::error::Deploy fejlede efter $max forsøg."
          exit 1

      - name: Deploy functions (separat, ikke-fatal)
        if: ${{ inputs.target == 'functions' || inputs.target == 'all' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          # Functions deployes ALENE og ikke-fatalt: 2nd-gen giver tit harmløse
          # 409'er ("already exists"/"unable to queue") som ikke må vælte
          # deployet eller blokere hosting-release'et (som allerede er kørt
          # ovenfor). En ægte functions-fejl ses som en advarsel i loggen.
          n=0; max=3
          until [ "$n" -ge "$max" ]; do
            n=$((n + 1))
            echo "::group::Functions-forsøg $n/$max"
            if firebase deploy --only functions:default --project "$PROJECT_ID" --non-interactive --force; then
              echo "::endgroup::"; echo "Functions deployet (forsøg $n/$max)."; exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Functions-deploy gav fejl på forsøg $n/$max (ofte harmløst 409)."
            [ "$n" -lt "$max" ] && sleep $((n * 15))
          done
          echo "::warning::Functions-deploy gennemført med fejl efter $max forsøg — ignoreret (hosting er allerede live)."

      - name: Deploy Firestore-indexes (idempotent, ikke-fatal)
        if: ${{ inputs.target != 'functions' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          # Nye indexes oprettes; eksisterende (409) eller "under opbygning"
          # ignoreres, så det aldrig fejler hele deployet.
          firebase deploy --only firestore:indexes --project "$PROJECT_ID" --non-interactive --force \
            || echo "::warning::Index-deploy gav en fejl (typisk 'findes allerede'/under opbygning) — ignoreret."

      - name: Seed database (valgfrit)
        if: ${{ inputs.seed }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npm run seed
