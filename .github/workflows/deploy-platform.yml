name: Deploy platform (tip.vejleaa.dk)

# Manuel udløsning: GitHub → Actions → "Deploy platform (tip.vejleaa.dk)" → Run workflow.
# Deployer den SAMLEDE platform-frontend + Firestore-regler/-indexes til
# projektet spil-89af9 (tip.vejleaa.dk). Deployer BEVIDST ikke Cloud Functions
# endnu (skelettet kører på ren klient + Firestore-regler).
#
# Engangsopsætning før første kørsel:
#   1) Repo → Settings → Secrets and variables → Actions → New repository secret:
#        FIREBASE_SERVICE_ACCOUNT_SPIL = hele JSON-indholdet af en service-account
#        for projektet spil-89af9 (Google Cloud Console → IAM → Service Accounts →
#        opret nøgle, eller genbrug firebase-adminsdk-kontoen). Se docs/platform-deploy.md.
#   Den offentlige web-config er bagt ind nedenfor (apiKey m.fl. er IKKE hemmelige).

on:
  workflow_dispatch:
    inputs:
      seedGames:
        description: 'Seed spillene (VM/Tour/Superliga) i databasen bagefter?'
        type: boolean
        # Default FALSE: en almindelig deploy skal ikke skrive i produktions-
        # databasen. Slå den kun til, når spil-dokumenterne faktisk skal ind.
        default: false
      seedSuperliga:
        # Labelen er det ENESTE, operatøren ser i klik-øjeblikket — YAML-
        # kommentarer er usynlige i Actions-UI'et. Derfor står forbeholdet her.
        description: 'Seed Superliga-kampprogrammet (kampe, der allerede har odds, springes over). NB: skriver ALTID teams og eloCurrent, uden forhåndsvisning. Skal tidspunkter rettes, så brug seedKickoffs — skal kun farver/kortkoder rettes, så brug seedTeams.'
        type: boolean
        default: false
      seedKickoffs:
        description: 'Ret KUN kickoff-tider fra kampprogram-filen (rører hverken odds, Elo eller resultater)?'
        type: boolean
        default: false
      seedKickoffsSkriv:
        # Default FALSE = tør-kørsel. drift.md åbner med "kør altid tør-kørslen
        # først og læs loggen", og kickoff ER tip-deadlinen — så forhåndsvisningen
        # skal være det, man får, når man ikke har taget stilling.
        description: 'seedKickoffs: SKRIV i databasen? Uden dette flueben tørkøres der, og ændringerne vises kun.'
        type: boolean
        default: false
      seedTeams:
        # Egen knap, fordi holdlisten er det ENESTE, der skal rettes, når en
        # trøjefarve er forældet. Alternativet — seedSuperliga — skriver også
        # `teams[].elo` og `eloCurrent` og har ingen forhåndsvisning.
        description: 'Ret KUN holdlisten (trøjefarver, kortkoder, stadion) — rører hverken kampe, odds, Elo eller resultater'
        type: boolean
        default: false
      seedTeamsSpil:
        description: 'seedTeams: hvilket spil? (superliga2627 eller pl2627-efteraar)'
        type: choice
        options:
          - superliga2627
          - pl2627-efteraar
        default: superliga2627
      seedTeamsSkriv:
        # Default FALSE = tør-kørsel, samme mønster som seedKickoffsSkriv.
        # Tør-kørslen printer hver eneste feltændring, og det er MENINGEN at
        # den læses igennem: den er den eneste vagt, der findes mod at repoets
        # holdliste og produktionens er drevet fra hinanden. Ingen frontend-test
        # kan se det — de kører alle på repoets liste.
        description: 'seedTeams: SKRIV i databasen? Uden dette flueben tørkøres der, og ændringerne vises kun.'
        type: boolean
        default: false
      deployFunctions:
        description: 'Deploy ALLE platform-functions (functions-platform/: afregning, Elo, synk, bot, mails) til spil-89af9?'
        type: boolean
        default: false
      bootstrapOwnerEmail:
        description: 'Gør denne e-mail til owner (kræver at brugeren har logget ind mindst én gang). Tom = spring over.'
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: spil-89af9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer afhængigheder
        run: npm ci

      - name: Tjek at service-account-secret er sat
        run: |
          if [ -z '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPIL }}' ]; then
            echo "::error::Mangler repo-secret FIREBASE_SERVICE_ACCOUNT_SPIL — tilføj service-account-JSON for spil-89af9 (se docs/platform-deploy.md)."
            exit 1
          fi

      - name: Skriv service-account fra secret
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPIL }}' > "$RUNNER_TEMP/sa.json"

      - name: Installer Firebase CLI
        run: npm install -g firebase-tools

      - name: Skriv .env til build (offentlig web-config for spil-89af9)
        run: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=AIzaSyDdP6zteOBHKOGWEIH6ARctMx3nOJc0Zhc
          VITE_FIREBASE_AUTH_DOMAIN=spil-89af9.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=spil-89af9
          VITE_FIREBASE_STORAGE_BUCKET=spil-89af9.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=549049171754
          VITE_FIREBASE_APP_ID=1:549049171754:web:627b27c367fc7dbdf82853
          VITE_USE_EMULATORS=false
          VITE_PLATFORM_MODE=true
          VITE_OWNER_EMAIL=cvejleaa@gmail.com
          EOF

      - name: Byg platform-frontend
        run: npm run build

      - name: Deploy hosting + regler (med backoff)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          ONLY="hosting,firestore:rules"
          n=0; max=3
          until [ "$n" -ge "$max" ]; do
            n=$((n + 1))
            echo "::group::Deploy-forsøg $n/$max"
            set +e
            out=$(firebase deploy --only "$ONLY" --project "$PROJECT_ID" --non-interactive --force 2>&1)
            code=$?
            set -e
            echo "$out"
            if [ "$code" -eq 0 ]; then echo "::endgroup::"; echo "Deploy lykkedes ($n/$max)."; break; fi
            if printf '%s' "$out" | grep -q "is the current active version"; then
              echo "::endgroup::"; echo "Hosting allerede aktiv version — OK ($n/$max)."; break
            fi
            echo "::endgroup::"; echo "::warning::Deploy fejlede ($n/$max)."
            if [ "$n" -ge "$max" ]; then echo "::error::Deploy fejlede efter $max forsøg."; exit 1; fi
            sleep $((n * 15))
          done

      - name: Deploy Firestore-indexes (idempotent, ikke-fatal)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          firebase deploy --only firestore:indexes --project "$PROJECT_ID" --non-interactive --force \
            || echo "::warning::Index-deploy gav en fejl (typisk 'findes allerede'/under opbygning) — ignoreret."

      # Storage-regler i EGET, ikke-fatalt trin. `firebase deploy --only storage`
      # fejler HÅRDT, hvis Firebase Storage ikke er aktiveret på projektet
      # ("has not been set up") — og lå det i hosting+rules-kommandoen ovenfor,
      # væltede en manglende bucket HELE udrulningen (hosting og functions med).
      # Reglerne beskytter kun en bucket, der findes; indtil Storage aktiveres i
      # konsollen, er de irrelevante. Når den er aktiveret, lander de ved næste
      # deploy. Kør en deploy IGEN, straks efter du har aktiveret Storage, så
      # deny-alle-klient-writes-reglen er på plads FØR nogen bruger upload.
      - name: Deploy Storage-regler (ikke-fatal — kræver aktiveret Storage)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          firebase deploy --only storage --project "$PROJECT_ID" --non-interactive --force \
            || echo "::warning::Storage-regel-deploy fejlede — er Firebase Storage aktiveret for $PROJECT_ID? (Console → Storage → Kom i gang). Kør deploy igen bagefter."

      - name: Seed games-collection'en
        if: ${{ inputs.seedGames }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node scripts/seed-games.mjs

      - name: Seed Superliga-kampprogram (valgfrit)
        if: ${{ inputs.seedSuperliga }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        # Samme skrivninger som det tidligere seed-superliga.mjs — bevist felt
        # for felt på et tomt spil (133 identiske skrivninger). ÉN forskel, og
        # den er med vilje: kampe, der ALLEREDE har odds, springes nu over i
        # stedet for at få dem overskrevet.
        #
        # Bemærk at spil-dokumentet (teams, eloCurrent) skrives ubetinget, også
        # når nul kampe skrives. Kørslen er altså ikke en ren no-op midt i en
        # sæson — men eloCurrent genberegnes af recomputeSeasonElo ved næste
        # resultat. `--skriv` står her, fordi tør-kørsel er default i scriptet.
        run: |
          node scripts/seed-football.mjs \
            --game superliga2627 \
            --teams src/data/superligaTeams2026.js \
            --fixtures scripts/superliga-fixtures.json \
            --skriv

      - name: Ret holdlisten (valgfrit)
        if: ${{ inputs.seedTeams }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          SPIL: ${{ inputs.seedTeamsSpil }}
        # Trøjefarverne bor i `games/{id}.teams`, og indtil nu kunne kun det
        # FULDE seed skrive dem — sammen med odds og Elo. En manglende
        # tredjefarve er ikke kosmetik: badgeFor falder tilbage på udetrøjen,
        # og holdet tegnes i en farve, der clasher med hjemmeholdets.
        #
        # Spil-id'et sendes som MILJØVARIABEL, ikke ind i argumentstrengen.
        # Et felt, der ordsplittes af shellen, kan bære sit eget ekstra flag —
        # det var præcis sådan `--apply` kunne smugles ind gennem "begræns til
        # ét spil-id" i audit-workflowet.
        run: |
          node scripts/seed-football.mjs \
            --game "$SPIL" \
            --teams "$([ "$SPIL" = pl2627-efteraar ] && echo src/data/premierLeagueTeams2026.js || echo src/data/superligaTeams2026.js)" \
            --teams-only \
            ${{ inputs.seedTeamsSkriv && '--skriv' || '' }}

      - name: Ret kickoff-tider (valgfrit)
        if: ${{ inputs.seedKickoffs }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        # Kickoff ER tip-deadlinen. Efter at seedSuperliga springer kampe med
        # odds over, kan den ikke længere rette et tidspunkt midt i sæsonen —
        # og alternativet ville være en produktionsnøgle på en bærbar.
        # Skriver KUN kickoff + updatedAt, og lader kampe med facit være.
        run: |
          node scripts/seed-football.mjs \
            --game superliga2627 \
            --fixtures scripts/superliga-fixtures.json \
            --kickoffs-only \
            ${{ inputs.seedKickoffsSkriv && '--skriv' || '' }}

      - name: Deploy Cloud Function (afregning + levende Elo)
        if: ${{ inputs.deployFunctions }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          # Platform-funktionerne bor i deres EGEN codebase (functions-platform),
          # så Firebase-CLI'en aldrig validerer Tour-motorens secrets
          # (SMTP_PASSWORD m.fl. findes kun i tour-85928) mod spil-89af9.
          npm --prefix functions-platform ci
          set +e
          out=$(firebase deploy --only functions:platform --project "$PROJECT_ID" --non-interactive --force 2>&1)
          code=$?
          set -e
          echo "$out"
          # Firebase-CLI'en exit'er med fejl hvis cleanup-policy for container-
          # images ikke kan sættes (kræver Artifact Registry Admin på deploy-
          # SA'en) — selvom funktionerne ER deployet. Det må ikke vælte kørslen.
          if [ "$code" -ne 0 ] && printf '%s' "$out" | grep -q "Functions successfully deployed but could not set up cleanup policy"; then
            echo "::warning::Funktionerne er deployet, men cleanup-policy for gamle container-images kunne ikke sættes. Giv evt. deploy-SA'en rollen 'Artifact Registry Administrator', eller kør 'firebase functions:artifacts:setpolicy --project spil-89af9' én gang."
            code=0
          fi
          exit "$code"

      - name: Bootstrap owner (valgfrit)
        if: ${{ inputs.bootstrapOwnerEmail != '' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          OWNER_EMAIL: ${{ inputs.bootstrapOwnerEmail }}
        run: node scripts/bootstrap-owner.mjs
