name: Tjek for dublet-tips (spil-89af9)

# Manuel udløsning: GitHub → Actions → denne workflow → Run workflow.
# LÆS-ONLY. Finder tips hvor samme spiller har flere dokumenter på samme kamp
# (muligt før doc-id-kravet kom i reglerne). Fejler hvis der findes nogen.
# Se scripts/audit-duplicate-bets.mjs.
#
# Bruger repo-secret FIREBASE_SERVICE_ACCOUNT_SPIL (spil-89af9).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer afhængigheder
        run: npm ci

      - name: Skriv service-account
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPIL }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Mangler FIREBASE_SERVICE_ACCOUNT_SPIL (spil-89af9)."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/spil-sa.json"

      - name: Tjek for dublet-tips
        env:
          SPIL_SA: ${{ runner.temp }}/spil-sa.json
        run: node scripts/audit-duplicate-bets.mjs
