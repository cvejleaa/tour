name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Alle fire jobs læser kun. GITHUB_TOKEN arver ellers repoets default, og to af
# jobbene installerer hele firebase-tools-træet upinnet — jo mindre tokenet kan,
# jo mindre kan en afhængighed.
permissions:
  contents: read

# Kør GitHub's JavaScript-actions på Node 24 (Node 20 udfases)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    name: Frontend – lint, unit-tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Skriv dummy .env til build
        run: |
          cat > .env <<'EOF'
          VITE_FIREBASE_API_KEY=demo-key
          VITE_FIREBASE_AUTH_DOMAIN=demo.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=demo-vm2026
          VITE_FIREBASE_STORAGE_BUCKET=demo.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID=000000000000
          VITE_FIREBASE_APP_ID=1:000000000000:web:demo
          VITE_USE_EMULATORS=false
          VITE_OWNER_EMAIL=cvejleaa@gmail.com
          EOF
      - run: npm run lint
      # EVNE_LOG: tappen i src/test/setup.js logger, hvilke knapper og felter
      # testene rører (docs/testing.md → Knapper og felter). Vagten bagefter
      # er rød ved et NYT urørt element, ved tom log, og når basislinjen kan
      # skrumpe. Basislinjen låser de kendte huller; den kræver ikke 100 %.
      - run: EVNE_LOG="$PWD/.evne-log" npm run test:coverage
      - name: Fladevagt — nye knapper og felter uden en test, der rører dem
        run: node scripts/flade-vagt.mjs
      # Repoet bygger TO apps fra samme kode (VITE_PLATFORM_MODE). Begge skal
      # bygges her — ellers kan platformen (tip.vejleaa.dk) gå i stykker, uden
      # at CI opdager det.
      - name: Byg Tour-udgaven
        run: npm run build
      - name: Byg platform-udgaven
        run: VITE_PLATFORM_MODE=true npm run build

  functions:
    name: Functions – scoring & standings tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: cd functions && npm ci && npm test
      - run: cd functions-platform && npm ci && npm test

  rules:
    name: Firestore Security Rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: cd functions && npm ci
      - run: npm install -g firebase-tools
      - name: Kør rules-tests mod Firestore-emulator
        run: firebase emulators:exec --only firestore "npm run test:rules" --project demo-vm2026

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Platform-testene kører mod Auth- og Firestore-emulatoren (Java) —
      # samme opsætning som rules-jobbet.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install -g firebase-tools
      - name: Skriv dummy .env
        run: |
          cat > .env <<'EOF'
          VITE_FIREBASE_API_KEY=demo-key
          VITE_FIREBASE_AUTH_DOMAIN=demo.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=demo-vm2026
          VITE_FIREBASE_STORAGE_BUCKET=demo.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID=000000000000
          VITE_FIREBASE_APP_ID=1:000000000000:web:demo
          VITE_USE_EMULATORS=false
          VITE_OWNER_EMAIL=cvejleaa@gmail.com
          EOF
      - run: npx playwright install --with-deps chromium
      - name: Kør E2E (Tour uden backend + platform mod emulatorer)
        run: npm run test:e2e:emu
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
